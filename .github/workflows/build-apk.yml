name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build the APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk Estimation.apk

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: Estimation-apk
          path: Estimation.apk

      - name: Publish the APK as the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Estimation Scorekeeper 1.0.${{ github.run_number }}
          make_latest: true
          files: Estimation.apk
          body: |
            Download **Estimation.apk** below and open it on your Android phone to install.
            The first time, Android asks you to allow installing apps from your browser or Files app.
