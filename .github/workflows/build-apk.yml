name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Ubuntu 24.04 images come with the Android SDK already installed.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find the Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK: $SDK"
          ls "$SDK/platforms" "$SDK/build-tools"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build the APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk Estimation.apk

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: Estimation-apk
          path: Estimation.apk

      - name: Publish the APK as the latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Estimation Scorekeeper 1.0.${{ github.run_number }}
          make_latest: true
          files: Estimation.apk
          body: |
            Download **Estimation.apk** below and open it on your Android phone to install.
            The first time, Android asks you to allow installing apps from your browser or Files app.
