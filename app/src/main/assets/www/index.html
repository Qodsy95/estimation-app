<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#145741">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Estimation">
<meta name="description" content="Score keeper for the Estimation card game: single or 2 v 2 teams, online or classic rules.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Estimation Scorekeeper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: phone-width app column; felt-green app bar, scrolling screen, fixed tab bar during a game */
  --bg:#eceee9; --surface:#fbfbf8; --surface-2:#f1f2ed; --ink:#121613; --ink-2:#4a514c; --muted:#737a75; --line:#d9ddd5;
  --accent:#17604a; --accent-ink:#ffffff; --accent-soft:#dcebe3;
  --felt:#145741; --felt-ink:#f4f2ea;
  --neg:#b42c2c; --pos:#12703f; --suit-red:#c42b2b; --suit-red-inv:#ff9a9a;
  --warn-bg:#fdf1d6; --warn-ink:#6b4a00; --err-bg:#fbe3e1; --err-ink:#8f1f1f;
  --p1:#2a78d6; --p2:#eb6834; --p3:#1baf7a; --p4:#eda100;
  --grid:#e1e0d9; --axis:#c3c2b7;
  --font-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:14px; --tabbar-h:62px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1210; --surface:#161b18; --surface-2:#1e2420; --ink:#eef1ec; --ink-2:#b8bfb9; --muted:#8c938d; --line:#2b322d;
    --accent:#45b088; --accent-ink:#04120c; --accent-soft:#1b3a2e;
    --felt:#0f3e2f; --felt-ink:#eef0e8;
    --neg:#f08a84; --pos:#62d39c; --suit-red:#ff8a80; --suit-red-inv:#b3261e;
    --warn-bg:#3a2e10; --warn-ink:#f5d58a; --err-bg:#3d1b1a; --err-ink:#f6b0aa;
    --p1:#3987e5; --p2:#d95926; --p3:#199e70; --p4:#c98500;
    --grid:#2c2c2a; --axis:#383835;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1210; --surface:#161b18; --surface-2:#1e2420; --ink:#eef1ec; --ink-2:#b8bfb9; --muted:#8c938d; --line:#2b322d;
  --accent:#45b088; --accent-ink:#04120c; --accent-soft:#1b3a2e;
  --felt:#0f3e2f; --felt-ink:#eef0e8;
  --neg:#f08a84; --pos:#62d39c; --suit-red:#ff8a80; --suit-red-inv:#b3261e;
  --warn-bg:#3a2e10; --warn-ink:#f5d58a; --err-bg:#3d1b1a; --err-ink:#f6b0aa;
  --p1:#3987e5; --p2:#d95926; --p3:#199e70; --p4:#c98500;
  --grid:#2c2c2a; --axis:#383835;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);font-weight:800;letter-spacing:-0.01em;text-wrap:balance;margin:0}
h2{font-size:19px}
h3{font-size:15px}

/* App shell */
.app{max-width:640px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.appbar{position:sticky;top:0;z-index:5;background:var(--felt);color:var(--felt-ink);padding-top:env(safe-area-inset-top);background-image:radial-gradient(120% 160% at 10% 0%,rgba(255,255,255,.09),transparent 60%)}
.appbar-inner{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left))}
.appbar-title{min-width:0}
.appbar h1{font-size:21px;line-height:1.15}
.appbar p{margin:1px 0 0;font-size:13px;opacity:.86}
.icon-btn{width:40px;height:40px;border-radius:999px;display:grid;place-items:center;color:var(--felt-ink);background:rgba(255,255,255,.12);border:0;flex:none;text-decoration:none}
.icon-btn:hover{background:rgba(255,255,255,.22)}
.icon-btn svg{width:22px;height:22px}
.mark{display:grid;grid-template-columns:1fr 1fr;width:38px;height:38px;flex:none;background:#fbfaf4;border-radius:8px;place-items:center;font-size:14px;line-height:1;color:#151515;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.mark .r{color:#c42b2b}
.appbar :focus-visible{outline-color:var(--felt-ink)}
.view{flex:1;display:grid;gap:14px;align-content:start;padding:16px max(16px,env(safe-area-inset-right)) calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.view.notabs{padding-bottom:calc(28px + env(safe-area-inset-bottom))}
.tabbar{position:fixed;bottom:0;left:0;right:0;margin:0 auto;max-width:640px;z-index:6;display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 16px rgba(0,0,0,.06)}
.tabbar a{display:grid;justify-items:center;align-content:center;gap:2px;min-height:var(--tabbar-h);font-size:12px;font-weight:700;color:var(--muted);text-decoration:none}
.tabbar a svg{width:24px;height:24px}
.tabbar a[aria-current="page"]{color:var(--accent)}

/* Shared pieces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.muted{font-size:13px;color:var(--ink-2)}
.hint{font-size:13px;color:var(--ink-2);margin:4px 0 0;max-width:65ch}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:0 0 4px}
.empty{color:var(--ink-2);font-size:14px;margin:8px 0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:999px;padding:9px 18px;font-weight:700;font-size:15px;min-height:44px;text-decoration:none;transition:background-color .15s}
.btn-block{width:100%}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:disabled{background:var(--surface-2);color:var(--muted);border-color:var(--line);cursor:not-allowed}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-danger{background:var(--surface);border-color:var(--line);color:var(--neg)}
.btn[data-armed]{background:var(--neg);border-color:var(--neg);color:#fff}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dot{width:11px;height:11px;border-radius:50%;flex:none;display:inline-block}
.c0{background:var(--p1)}.c1{background:var(--p2)}.c2{background:var(--p3)}.c3{background:var(--p4)}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap;border-radius:var(--radius);padding:12px 14px;font-size:15px}
.banner.final{background:var(--accent-soft);color:var(--ink)}
.banner.final b{font-family:var(--font-display);font-weight:800}
.chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.chip.speed{background:var(--accent-soft);color:var(--ink);border-color:transparent}
.chip.mult{background:var(--warn-bg);color:var(--warn-ink);border-color:transparent}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px;border:1px solid var(--line);margin-top:10px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:700;font-size:15px;color:var(--ink-2);display:grid;gap:1px;text-align:center;min-height:44px}
.seg button small{font-weight:500;font-size:12px;color:var(--muted)}
.seg button[aria-checked="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.copy-fallback textarea{width:100%;min-height:140px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);padding:10px;font-size:13px;margin-top:8px}

/* Home */
.hero{display:flex;gap:14px;align-items:center}
.hero .mark{width:56px;height:56px;font-size:20px;border-radius:10px}
.hero p{margin:4px 0 0;font-size:14px;color:var(--ink-2)}
.resume h2{font-size:22px}
.past{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.past button{width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;display:grid;gap:2px}
.past button:hover{background:var(--surface-2)}
.past .p-date{font-size:12px;color:var(--muted);font-weight:600}
.past .p-win{font-weight:700}
.past .p-names{font-size:13px;color:var(--ink-2)}

/* Setup */
.tablemap{display:grid;grid-template-columns:minmax(0,1fr) 84px minmax(0,1fr);grid-template-areas:"top top top" "left felt right" "bottom bottom bottom";gap:10px;align-items:center;margin-top:12px}
.seat{display:grid;gap:4px;min-width:0}
.seat.top,.seat.bottom{justify-self:center;width:min(100%,220px)}
.seat.top{grid-area:top}.seat.bottom{grid-area:bottom}.seat.left{grid-area:left}.seat.right{grid-area:right}
.seat label{font-size:12px;font-weight:700;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.seat input,.field input,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--surface-2);color:var(--ink);font-weight:600;min-height:44px}
.seat input:focus,.field input:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.felt{grid-area:felt;aspect-ratio:1;border-radius:14px;background:var(--felt);color:var(--felt-ink);display:grid;place-items:center;text-align:center;font-size:11px;font-weight:700;line-height:1.2;padding:6px}
.felt b{font-size:24px;display:block;line-height:1}
.teamnames{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
@media (max-width:420px){.teamnames{grid-template-columns:1fr}}
.choice{display:grid;gap:10px;margin-top:10px}
.choice button{display:grid;gap:3px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px 12px 46px;position:relative}
.choice button::before{content:"";position:absolute;left:15px;top:14px;width:18px;height:18px;border-radius:50%;border:2px solid var(--axis);box-sizing:border-box}
.choice button[aria-checked="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.choice button[aria-checked="true"]::before{border-color:var(--accent);background:radial-gradient(circle,var(--accent) 0 4px,transparent 5px)}
.choice b{font-size:15px}
.choice span{font-size:13px;color:var(--ink-2)}
.sticky-cta{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom));z-index:3}
.sticky-cta .btn{box-shadow:0 8px 24px rgba(0,0,0,.18)}
.note{font-size:13px;color:var(--warn-ink);background:var(--warn-bg);border-radius:10px;padding:8px 12px;margin:0}

/* Scoreboard strip */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.board.teams{grid-template-columns:repeat(2,minmax(0,1fr))}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 10px;display:grid;gap:1px;min-width:0}
.pcard.lead{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pc-top{display:flex;align-items:center;gap:6px;min-width:0}
.pc-name{font-weight:700;font-size:13px;flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.2}
.rank{font-size:11px;font-weight:700;color:var(--ink-2);background:var(--surface-2);border-radius:999px;padding:1px 7px;flex:none}
.pcard.lead .rank{background:var(--accent);color:var(--accent-ink)}
.pc-total{font-family:var(--font-display);font-weight:800;font-size:26px;line-height:1.1;letter-spacing:-0.02em;font-variant-numeric:tabular-nums}
.board.teams .pc-total{font-size:34px}
.pc-total.neg{color:var(--neg)}
.pc-last{font-size:12px;color:var(--ink-2);overflow-wrap:anywhere}
@media (max-width:380px){.pc-total{font-size:22px}}

/* Round entry */
.entry{container-type:inline-size}
.entry-head{display:flex;align-items:center;gap:6px 8px;flex-wrap:wrap}
.entry-head h2{margin-right:4px}
.prow{display:grid;grid-template-areas:"name est tricks prev";grid-template-columns:minmax(0,1fr) auto auto 96px;gap:10px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.p-name{grid-area:name;display:grid;gap:5px;min-width:0}
.p-nm{display:flex;align-items:center;gap:8px;font-weight:700;overflow-wrap:anywhere}
.p-team{font-size:12px;color:var(--muted);font-weight:600}
.p-tags{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.p-est{grid-area:est}.p-tricks{grid-area:tricks}
.p-prev{grid-area:prev;text-align:right;display:grid;gap:2px;justify-items:end}
@container (max-width:540px){
  .prow{grid-template-areas:"name prev" "est tricks";grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .stepper{justify-items:stretch}
  .s-ctl{justify-content:space-between}
}
.toggle{font-size:12px;font-weight:600;border:1px dashed var(--axis);background:transparent;color:var(--ink-2);border-radius:6px;padding:3px 8px;min-height:30px}
.toggle[aria-pressed="true"]{border-style:solid;border-color:var(--ink);background:var(--ink);color:var(--surface)}
.tag{font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);line-height:1.2}
.tag.call{background:var(--accent);color:var(--accent-ink)}
.tag.with{background:var(--accent-soft);color:var(--ink)}
.tag.risk{background:var(--warn-bg);color:var(--warn-ink)}
.stepper{display:grid;gap:4px;justify-items:center}
.s-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.s-ctl{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);overflow:hidden}
.s-ctl button{width:46px;height:46px;border:0;background:transparent;font-size:24px;font-weight:600;line-height:1;color:var(--ink);touch-action:manipulation}
.s-ctl button:hover:not(:disabled){background:var(--line)}
.s-ctl button:disabled{color:var(--muted);opacity:.4;cursor:not-allowed}
.s-val{min-width:38px;text-align:center;font-family:var(--font-display);font-weight:800;font-size:23px;font-variant-numeric:tabular-nums}
.s-val.empty{color:var(--muted);font-weight:600}
.pts{font-family:var(--font-display);font-weight:800;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.pts.pos{color:var(--pos)}.pts.neg{color:var(--neg)}.pts.none{color:var(--muted);font-weight:600}
.why{font-size:12px;color:var(--ink-2);text-align:right;line-height:1.35}
.roles{display:grid;gap:12px;padding:14px 0 12px;border-top:1px solid var(--line)}
.role-label{font-size:13px;font-weight:700;color:var(--ink-2);margin:0 0 6px}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.pick button:hover:not(:disabled){border-color:var(--ink-2)}
.pick button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.pick button:disabled{opacity:.4;cursor:not-allowed}
.status{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.stat{background:var(--surface-2);border-radius:8px;padding:7px 10px;font-size:14px;font-variant-numeric:tabular-nums}
.msgs{list-style:none;padding:0;margin:0 0 12px;display:grid;gap:6px}
.msgs:empty{display:none}
.msgs li{font-size:14px;padding:7px 10px 7px 34px;border-radius:8px;position:relative}
.msgs li::before{position:absolute;left:10px;top:9px;width:16px;height:16px;border-radius:50%;font-size:11px;font-weight:800;display:grid;place-items:center;line-height:1}
.msgs li.error{background:var(--err-bg);color:var(--err-ink)}
.msgs li.error::before{content:"!";background:var(--err-ink);color:var(--err-bg)}
.msgs li.warn{background:var(--warn-bg);color:var(--warn-ink)}
.msgs li.warn::before{content:"?";background:var(--warn-ink);color:var(--warn-bg)}

/* Standings & tables */
.stand{list-style:none;margin:8px 0 0;padding:0;display:grid}
.stand li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.stand li:first-child{border-top:0}
.stand .rk{font-family:var(--font-display);font-weight:800;font-size:17px;color:var(--muted)}
.stand .nm{font-weight:700;display:flex;align-items:center;gap:8px;overflow-wrap:anywhere}
.stand .sb{display:block;font-size:12px;color:var(--ink-2);font-weight:500;margin-top:1px}
.stand .tt{font-family:var(--font-display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.stand .tt.neg{color:var(--neg)}
.stand.small .tt{font-size:17px}
.stand.compact li{padding:6px 0}
.subhead{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 0}
.table-wrap{overflow-x:auto;margin-top:10px;border:1px solid var(--line);border-radius:10px;max-height:480px;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
th:first-child{text-align:left}
thead th{font-size:12px;color:var(--ink-2);font-weight:700;background:var(--surface-2);position:sticky;top:0;z-index:1}
thead th .dot{width:9px;height:9px;margin-right:4px}
th.tcol,td.tcol{background:color-mix(in srgb,var(--surface-2) 60%,transparent);border-left:1px solid var(--line)}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface-2)}
tbody tr.editing{background:var(--accent-soft)}
.rbtn{border:0;background:none;padding:0;font-weight:700;color:var(--ink);text-decoration:underline;text-decoration-color:var(--axis);text-underline-offset:3px}
.rno{font-weight:700}
.rsub{display:block;font-size:11px;color:var(--muted);font-weight:600}
.rsub.sa{color:var(--warn-ink);background:var(--warn-bg);border-radius:4px;padding:0 4px;display:inline-block;margin-top:2px}
td .v{font-weight:700}
td .v.neg{color:var(--neg)}
td .sub{display:block;font-size:11px;color:var(--muted)}
tfoot th,tfoot td{font-weight:800;font-size:15px;border-bottom:0;background:var(--surface-2);position:sticky;bottom:0}
.compare{margin-top:10px}
.compare table{font-size:13px}
.compare th,.compare td{text-align:left;white-space:normal;vertical-align:top}
.compare tbody th{font-weight:600;color:var(--ink-2)}
.compare td.diff{font-weight:700;color:var(--ink)}

/* Chart */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink-2);margin:8px 0 4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:3px;border-radius:2px;display:inline-block;flex:none}
.sw0{background:var(--p1)}.sw1{background:var(--p2)}.sw2{background:var(--p3)}.sw3{background:var(--p4)}
.chart{position:relative;min-height:40px}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.gl{stroke:var(--grid);stroke-width:1}
.zero{stroke:var(--axis);stroke-width:1}
.tk{fill:var(--muted);font-size:11px;font-family:var(--font-body);font-variant-numeric:tabular-nums}
.ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}

<script>
(function(){
"use strict";
const $ = (s, root) => (root || document).querySelector(s);
const $$ = (s, root) => Array.from((root || document).querySelectorAll(s));
const STORE_KEY = "estimation-app-v2";
const OLD_KEY = "estimation-scorekeeper-v1";
const SUIT_ORDER = ["No trump","♠ Spades","♥ Hearts","♦ Diamonds","♣ Clubs"];
const TEAMS = [[0,2],[1,3]];
const SCORE_KEYS = ["base","callBonus","withBonus","riskBonus","onlyWinner","onlyLoser","dashOver","dashUnder","dashZeroUnder","bigCall","riskStep","maxRisk","riskExact","teamBonus","saaydeh","withInSpeed"];
const PRESETS = {
  jawaker: {name:"Online (Jawaker)", base:10, callBonus:10, withBonus:10, riskBonus:10, onlyWinner:10, onlyLoser:10,
    dashOver:25, dashUnder:33, dashZeroUnder:0, bigCall:0, riskStep:2, maxRisk:3, riskExact:false, teamBonus:0, saaydeh:"double", withInSpeed:false},
  classic: {name:"Classic score sheet", base:10, callBonus:10, withBonus:10, riskBonus:10, onlyWinner:10, onlyLoser:10,
    dashOver:23, dashUnder:33, dashZeroUnder:10, bigCall:8, riskStep:2, maxRisk:2, riskExact:false, teamBonus:0, saaydeh:"double", withInSpeed:false}
};
const GAME_DEFAULTS = {minBid:4, totalRounds:18, speedRounds:5};
const RULE_KEYS = SCORE_KEYS.concat(Object.keys(GAME_DEFAULTS));
function presetRules(p){
  const o = {};
  SCORE_KEYS.forEach(k => { o[k] = PRESETS[p][k]; });
  return Object.assign(o, GAME_DEFAULTS);
}
// The rules a new install starts with: online scoring, Risk only at exact multiples, +10 when both partners make it.
function defaultMyRules(){ return Object.assign(presetRules("jawaker"), {riskExact: true, teamBonus: 10}); }
function pickRules(R){ const o = {}; RULE_KEYS.forEach(k => { o[k] = R[k]; }); return o; }
const sameScoring = (A, B) => SCORE_KEYS.every(k => A[k] === B[k]);
const sameRules = (A, B) => RULE_KEYS.every(k => A[k] === B[k]);
function detectPreset(R){
  for (const p in PRESETS) if (sameScoring(PRESETS[p], R)) return p;
  return "custom";
}

// CALC-START
function isSpeedRound(no, R){
  const first = R.totalRounds - R.speedRounds + 1;
  return R.speedRounds > 0 && no >= first && no <= R.totalRounds;
}
function speedTrump(no, R){
  const first = R.totalRounds - R.speedRounds + 1;
  return SUIT_ORDER[(no - first) % SUIT_ORDER.length];
}
function riskName(level){
  return ["", "Risk", "Double risk", "Triple risk"][level] || ("Risk ×" + level);
}
// diff = how far the total of estimates is from 13.
function riskLevelFor(diff, R){
  if (!(R.riskStep > 0) || diff <= 0) return 0;
  if (R.riskExact) return diff % R.riskStep === 0 ? Math.min(R.maxRisk, diff / R.riskStep) : 0;
  return Math.min(R.maxRisk, Math.floor(diff / R.riskStep));
}
function scoreRound(r, R, no, mult, teams){
  const has = v => v !== null && v !== undefined;
  const est = r.est.map((e, i) => r.dashCall[i] ? 0 : e);
  const tricks = r.tricks;
  const estDone = est.every(has);
  const tricksDone = tricks.every(has);
  const sumEst = est.reduce((a, e) => a + (e || 0), 0);
  const sumTricks = tricks.reduce((a, t) => a + (t || 0), 0);
  const over = sumEst > 13;
  const diff = Math.abs(sumEst - 13);
  const riskLevel = riskLevelFor(diff, R);
  const speed = isSpeedRound(no, R);
  const maxEst = est.reduce((a, e) => Math.max(a, e || 0), 0);
  const bigFactor = R.bigCall > 0 && estDone && maxEst >= R.bigCall ? 2 : 1;
  const dblFactor = r.doubled ? 2 : 1;
  const caller = (!has(r.caller) || r.dashCall[r.caller]) ? null : r.caller;
  const callerEst = caller === null ? null : est[caller];
  const roles = est.map((e, i) => {
    const isCall = caller === i;
    const isWith = !isCall && caller !== null && !r.dashCall[i] && has(e) && has(callerEst) &&
      callerEst > 0 && e === callerEst && (!speed || R.withInSpeed);
    const isRisk = r.risk === i && riskLevel > 0;
    return {isCall, isWith, isRisk, dashCall: !!r.dashCall[i]};
  });
  const res = {est, sumEst, sumTricks, over, diff, riskLevel, speed, caller, roles, mult, bigFactor, dblFactor,
    estDone, tricksDone, complete: estDone && tricksDone && sumTricks === 13,
    made: null, winners: null, points: null, parts: null, saaydeh: false};
  if (!res.complete) return res;
  const made = est.map((e, i) => tricks[i] === e);
  const W = made.filter(Boolean).length;
  res.made = made; res.winners = W;
  if (W === 0){
    res.saaydeh = true; res.points = [0, 0, 0, 0]; res.parts = est.map(() => []);
    return res;
  }
  res.parts = [];
  for (let i = 0; i < 4; i++){
    const p = []; const ok = made[i]; const ro = roles[i];
    if (ro.dashCall){
      const v = over ? R.dashOver : R.dashUnder;
      p.push(["Dash call", ok ? v : -v]);
    } else if (ok){
      p.push(["Exact", R.base]);
      if (tricks[i] > 0) p.push([tricks[i] === 1 ? "1 trick" : tricks[i] + " tricks", tricks[i]]);
    } else {
      const d = Math.abs(tricks[i] - est[i]);
      p.push(["Off by " + d, -d]);
    }
    if (!ro.dashCall && est[i] === 0 && !over && R.dashZeroUnder > 0)
      p.push(["Dash, under", ok ? R.dashZeroUnder : -R.dashZeroUnder]);
    if (ro.isCall) p.push(["Call", ok ? R.callBonus : -R.callBonus]);
    if (ro.isWith) p.push(["With", ok ? R.withBonus : -R.withBonus]);
    if (ro.isRisk) p.push([riskName(riskLevel), (ok ? 1 : -1) * R.riskBonus * riskLevel]);
    if (W === 1 && ok) p.push(["Only winner", R.onlyWinner]);
    if (W === 3 && !ok) p.push(["Only loser", -R.onlyLoser]);
    res.parts.push(p);
  }
  // Teams: when both partners make it, the bonus goes to one partner only,
  // the one with the higher estimate (the first seat of the pair if equal).
  if (teams && R.teamBonus > 0){
    TEAMS.forEach(([a, b]) => {
      if (made[a] && made[b]) res.parts[est[b] > est[a] ? b : a].push(["Team bonus", R.teamBonus]);
    });
  }
  res.points = res.parts.map(p => p.reduce((s, x) => s + x[1], 0) * mult * bigFactor * dblFactor);
  return res;
}
function computeGame(rounds, R, teams){
  let mult = 1;
  const totals = [0, 0, 0, 0];
  const cum = [[0], [0], [0], [0]];
  const out = [];
  rounds.forEach((r, idx) => {
    const res = scoreRound(r, R, idx + 1, mult, teams);
    res.teamPoints = res.points ? TEAMS.map(m => res.points[m[0]] + res.points[m[1]]) : [0, 0];
    out.push(res);
    if (res.points) res.points.forEach((v, i) => { totals[i] += v; });
    for (let i = 0; i < 4; i++) cum[i].push(totals[i]);
    mult = res.saaydeh ? (R.saaydeh === "double" ? mult * 2 : mult + 1) : 1;
  });
  const teamTotals = TEAMS.map(m => totals[m[0]] + totals[m[1]]);
  const teamCum = TEAMS.map(m => cum[m[0]].map((v, k) => v + cum[m[1]][k]));
  return {rounds: out, totals, cum, teamTotals, teamCum, nextMult: mult};
}
// CALC-END

/* ---------- Storage ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function freshStore(){
  return {current: null, history: [], myRules: defaultMyRules(), players: [],
    last: {players: ["", "", "", ""], teamNames: ["", ""], mode: "single", rulesChoice: "mine"}};
}
function normalize(g){
  // Games saved before Risk-at-multiples and the team bonus existed keep the scoring they were played with.
  g.rules = Object.assign(presetRules("jawaker"), g.rules || {});
  delete g.rules.preset;
  g.teamNames = Array.isArray(g.teamNames) ? g.teamNames : ["", ""];
  g.mode = g.mode === "teams" ? "teams" : "single";
  g.rounds = Array.isArray(g.rounds) ? g.rounds : [];
  return g;
}
function addToRoster(s, names){
  (names || []).forEach(n => {
    const t = (n || "").trim();
    if (t && !s.players.some(p => p.toLowerCase() === t.toLowerCase())) s.players.push(t);
  });
}
function load(){
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw){
      const s = JSON.parse(raw);
      if (s && Array.isArray(s.history)){
        s.last = Object.assign(freshStore().last, s.last || {});
        if (!["mine", "jawaker", "classic"].includes(s.last.rulesChoice)) s.last.rulesChoice = "mine";
        delete s.last.preset;
        s.myRules = pickRules(Object.assign(defaultMyRules(), s.myRules || {}));
        if (s.current) normalize(s.current);
        s.history.forEach(normalize);
        if (!Array.isArray(s.players)){
          s.players = [];
          addToRoster(s, s.last.players);
          if (s.current) addToRoster(s, s.current.players);
          s.history.forEach(h => addToRoster(s, h.players));
        }
        return s;
      }
    }
  } catch (e) {}
  const s = freshStore();
  try {
    const old = JSON.parse(localStorage.getItem(OLD_KEY) || "null");
    if (old && Array.isArray(old.players) && Array.isArray(old.rounds) && old.rounds.length && !old.example){
      const rules = Object.assign(presetRules("jawaker"), old.settings || {});
      s.current = normalize({id: uid(), started: new Date().toISOString(), mode: "single",
        players: old.players.slice(0, 4), teamNames: ["", ""], rules, rounds: old.rounds});
      s.last.players = old.players.slice(0, 4);
      addToRoster(s, old.players);
    }
  } catch (e) {}
  return s;
}
let store = load();
function persist(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) {} }
function archiveCurrent(){
  const g = store.current;
  if (g && g.rounds.length){
    g.ended = new Date().toISOString();
    store.history.unshift(g);
    store.history = store.history.slice(0, 40);
  }
  store.current = null;
  editingIndex = null; draft = emptyDraft();
  persist();
}

/* ---------- Helpers ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtPts = v => v > 0 ? "+" + v : v < 0 ? "−" + Math.abs(v) : "0";
const fmtTotal = v => v < 0 ? "−" + Math.abs(v) : String(v);
const ordinal = n => n + (["th","st","nd","rd"][(n % 100 > 10 && n % 100 < 14) ? 0 : (n % 10 < 4 ? n % 10 : 0)]);
const ranks = arr => arr.map(t => 1 + arr.filter(o => o > t).length);
const nameOf = (g, i) => (g.players[i] || "").trim() || ("Player " + (i + 1));
const teamOf = i => TEAMS[0].includes(i) ? 0 : 1;
const teamNameOf = (g, t) => (g.teamNames[t] || "").trim() || ("Team " + (t + 1));
const colorOf = (g, i) => g.mode === "teams" ? teamOf(i) : i;
const modeLabel = g => g.mode === "teams" ? "Teams 2 v 2" : "Single";
function ruleSetOf(R){
  if (store.myRules && sameScoring(store.myRules, R)) return "mine";
  return detectPreset(R);
}
const RULESET_NAMES = {mine: "My rules", jawaker: "Online (Jawaker)", classic: "Classic score sheet", custom: "Custom rules"};
const presetLabel = R => RULESET_NAMES[ruleSetOf(R)];
const calcGame = g => computeGame(g.rounds, g.rules, g.mode === "teams");
// Same order as SUIT_ORDER, which is also the speed-round trump order.
const SUITS = [
  {k: "nt", sym: "NT", name: "No trump"},
  {k: "s", sym: "♠", name: "Spades"},
  {k: "h", sym: "♥", name: "Hearts", red: true},
  {k: "d", sym: "♦", name: "Diamonds", red: true},
  {k: "c", sym: "♣", name: "Clubs"}
];
const suitOf = k => SUITS.find(x => x.k === k) || null;
const suitGlyph = k => { const x = suitOf(k); return x ? `<span class="sg ${x.red ? "red" : ""}">${x.sym}</span>` : ""; };
function speedSuit(no, R){ const first = R.totalRounds - R.speedRounds + 1; return SUITS[(no - first) % SUITS.length].k; }
// King (crown) on the highest total, Kooz (corn cob) on the lowest. Ties share the badge; nothing while everyone is level.
function badgesFor(vals, n){
  if (!n) return vals.map(() => null);
  const hi = Math.max(...vals), lo = Math.min(...vals);
  if (hi === lo) return vals.map(() => null);
  return vals.map(v => v === hi ? "king" : v === lo ? "kooz" : null);
}
const BADGE = {
  king: `<span class="badge" title="King: highest score"><svg viewBox="0 0 24 24" role="img" aria-label="King, highest score"><use href="#ic-king"/></svg></span>`,
  kooz: `<span class="badge" title="Kooz: lowest score"><svg viewBox="0 0 24 24" role="img" aria-label="Kooz, lowest score"><use href="#ic-kooz"/></svg></span>`
};
function dateLabel(iso){
  try { const d = new Date(iso); return d.toLocaleDateString(undefined, {day: "numeric", month: "short"}) + ", " + d.toLocaleTimeString(undefined, {hour: "numeric", minute: "2-digit"}); }
  catch (e) { return ""; }
}
function sides(g, c){
  return g.mode === "teams"
    ? [0, 1].map(t => ({label: teamNameOf(g, t), total: c.teamTotals[t], ci: t, sub: TEAMS[t].map(i => nameOf(g, i)).join(" & ")}))
    : [0, 1, 2, 3].map(i => ({label: nameOf(g, i), total: c.totals[i], ci: i, sub: ""}));
}
function winnerText(g, c){
  const s = sides(g, c);
  const top = Math.max(...s.map(x => x.total));
  const w = s.filter(x => x.total === top).map(x => x.label);
  return w.length === 1 ? `${w[0]} won with ${fmtTotal(top)}` : `${w.join(" and ")} tied at ${fmtTotal(top)}`;
}
function armConfirm(btn, armedLabel, action){
  if (btn.dataset.armed){
    clearTimeout(btn._t); delete btn.dataset.armed; btn.textContent = btn._orig; action();
    return;
  }
  btn._orig = btn.textContent; btn.dataset.armed = "1"; btn.textContent = armedLabel;
  btn._t = setTimeout(() => { delete btn.dataset.armed; btn.textContent = btn._orig; }, 4000);
}

/* ---------- Round draft ---------- */
let editingIndex = null;
let draft = emptyDraft();
let calc = null;
function emptyDraft(){
  return {est: [null, null, null, null], tricks: [null, null, null, null], dashCall: [false, false, false, false],
    caller: null, risk: null, callerManual: false, riskManual: false, suit: null, suitManual: false, doubled: false};
}
function packDraft(){
  return {est: draft.est.map((e, i) => draft.dashCall[i] ? 0 : e), tricks: draft.tricks.slice(),
    dashCall: draft.dashCall.slice(), caller: draft.caller, risk: draft.risk, suit: draft.suit || null, doubled: !!draft.doubled};
}
const roundNo = () => editingIndex !== null ? editingIndex + 1 : store.current.rounds.length + 1;
const roundMult = () => editingIndex !== null ? calc.rounds[editingIndex].mult : calc.nextMult;
function autoRoles(){
  const speed = isSpeedRound(roundNo(), store.current.rules);
  if (draft.caller !== null && draft.dashCall[draft.caller]){ draft.caller = null; draft.callerManual = false; }
  if (!draft.callerManual){
    let best = null, bv = -1;
    for (let i = 0; i < 4; i++){
      const e = draft.est[i];
      if (!draft.dashCall[i] && e !== null && e > bv){ bv = e; best = i; }
    }
    draft.caller = best;
  }
  if (!draft.riskManual) draft.risk = (!speed && draft.caller !== null) ? (draft.caller + 3) % 4 : null;
}

function route(){
  let v = (location.hash || "").replace(/^#/, "");
  if (!VIEWS.includes(v)) v = store.current ? "play" : "home";
  if ((v === "play" || v === "scores") && !store.current) v = "home";

  if (location.hash === "#" + v) route();

}

  const order = s.map((x, k) => k).sort((a, b) => s[b].total - s[a].total);
  return `<ol class="stand ${cls || ""}">` + order.map(k => `<li><span class="rk">${g.rounds.length ? rk[k] : "–"}</span>
    <span class="nm"><span class="dot c${s[k].ci}" aria-hidden="true"></span><span>${esc(s[k].label)}${s[k].sub ? `<span class="sb">${esc(s[k].sub)}</span>` : ""}</span>${bd[k] ? BADGE[bd[k]] : ""}</span>
    <span class="tt ${s[k].total < 0 ? "neg" : ""}">${fmtTotal(s[k].total)}</span></li>`).join("") + `</ol>`;
}

    store.current.rounds.splice(editingIndex, 1); editingIndex = null; draft = emptyDraft(); persist(); updatePlay();
  }));
  updatePlay();
}
function updatePlay(){
  const g = store.current, R = g.rules;
  calc = calcGame(g);
  autoRoles();
  const no = roundNo(), mult = roundMult(), speed = isSpeedRound(no, R);
  if (speed && !draft.suitManual && !draft.suit) draft.suit = speedSuit(no, R);
  const res = scoreRound(packDraft(), R, no, mult, g.mode === "teams");
  const n = g.rounds.length;
  $("#board").innerHTML = boardHTML(g, calc);
  const fb = $("#finalBanner");
  if (n >= R.totalRounds && editingIndex === null){
    fb.innerHTML = `<span class="win">${BADGE.king}<span><b>${esc(winnerText(g, calc))}</b> after ${n} rounds.</span></span><span class="actions"><a class="btn btn-primary" href="#scores">See scores</a></span>`;
    fb.hidden = false;
  } else fb.hidden = true;

  $("#entryTitle").textContent = editingIndex !== null ? `Fixing round ${no}` : (no > R.totalRounds ? `Extra round ${no}` : `Round ${no}`);
  let chips = speed ? `<span class="chip speed">Speed round · ${esc(speedTrump(no, R))}</span>` : `<span class="chip">Bidding round</span>`;
  if (mult > 1) chips += `<span class="chip mult">×${mult} Sa'aydeh</span>`;
  if (res.bigFactor > 1) chips += `<span class="chip mult">Estimate of ${R.bigCall}+ · ×2</span>`;
  if (res.dblFactor > 1) chips += `<span class="chip mult">Doubled ×2</span>`;
  $("#dblBtn").setAttribute("aria-pressed", String(!!draft.doubled));
  $("#dblTxt").textContent = draft.doubled ? "Round doubled · tap to undo" : "Double this round";
  $("#entryChips").innerHTML = chips;
  $("#suitLabel").textContent = speed ? "Trump suit (fixed in speed rounds, change it if your table differs)" : "Trump suit called";
  $("#suitPick").innerHTML = SUITS.map(x => `<button type="button" data-suit="${x.k}" aria-pressed="${draft.suit === x.k}">` +
    (x.k === "nt" ? "No trump" : `<span class="sg ${x.red ? "red" : ""}" aria-hidden="true">${x.sym}</span>${x.name}`) + `</button>`).join("");
  $("#callLabel").textContent = speed ? "Call: highest estimate (first to say it)" : "Call: who won the bidding";

  for (let i = 0; i < 4; i++){
    const nm = nameOf(g, i);
    $("#nm" + i).textContent = nm;
    const dc = draft.dashCall[i];
    const db = $("#dash" + i);
    db.setAttribute("aria-pressed", String(dc));
    db.setAttribute("aria-label", `Dash call for ${nm}`);
    const ev = $("#estV" + i), tv = $("#trV" + i);
    ev.textContent = draft.est[i] === null ? "?" : draft.est[i];
    ev.classList.toggle("empty", draft.est[i] === null);
    tv.textContent = draft.tricks[i] === null ? "?" : draft.tricks[i];
    tv.classList.toggle("empty", draft.tricks[i] === null);
    $("#estDn" + i).disabled = dc || draft.est[i] === 0;
    $("#estUp" + i).disabled = dc || draft.est[i] === 13;
    $("#trDn" + i).disabled = draft.tricks[i] === 0;
    $("#trUp" + i).disabled = draft.tricks[i] === 13;
    $("#estDn" + i).setAttribute("aria-label", `Lower ${nm}'s estimate`);
    $("#estUp" + i).setAttribute("aria-label", `Raise ${nm}'s estimate`);
    $("#trDn" + i).setAttribute("aria-label", `Lower ${nm}'s tricks won`);
    $("#trUp" + i).setAttribute("aria-label", `Raise ${nm}'s tricks won`);
    const ro = res.roles[i];
    let tags = "";
    if (ro.isCall) tags += `<span class="tag call">Call</span>`;
    if (ro.isWith) tags += `<span class="tag with">With</span>`;
    if (ro.isRisk) tags += `<span class="tag risk">${riskName(res.riskLevel)}</span>`;
    else if (draft.risk === i) tags += `<span class="tag">Last</span>`;
    $("#tags" + i).innerHTML = tags;
    const pts = $("#pts" + i), why = $("#why" + i);
    if (res.points){
      const v = res.points[i];
      pts.textContent = fmtPts(v);
      pts.className = "pts " + (v > 0 ? "pos" : v < 0 ? "neg" : "none");
      why.textContent = res.saaydeh ? "Nobody made it"
        : (res.made[i] ? "Made it · " : "Missed · ") + res.parts[i].map(([l, x]) => `${l} ${fmtPts(x)}`).join(", ") +
          (mult > 1 ? ` · ×${mult}` : "") + (res.bigFactor > 1 ? " · ×2" : "") + (res.dblFactor > 1 ? " · doubled ×2" : "");
    } else { pts.textContent = ""; pts.className = "pts none"; why.textContent = ""; }
  }
  $("#callerPick").innerHTML = [0, 1, 2, 3].map(i =>
    `<button type="button" data-i="${i}" aria-pressed="${draft.caller === i}" ${draft.dashCall[i] ? "disabled" : ""}><span class="dot c${colorOf(g, i)}" aria-hidden="true"></span>${esc(nameOf(g, i))}</button>`).join("");
  $("#riskPick").innerHTML = [0, 1, 2, 3].map(i =>
    `<button type="button" data-i="${i}" aria-pressed="${draft.risk === i}"><span class="dot c${colorOf(g, i)}" aria-hidden="true"></span>${esc(nameOf(g, i))}</button>`).join("") +
    `<button type="button" data-i="none" aria-pressed="${draft.risk === null}">Nobody</button>`;

  let st = "";
  if (res.estDone){
    const ou = res.sumEst === 13 ? "exactly 13" : (res.over ? `Over by ${res.diff}` : `Under by ${res.diff}`);
    st += `<span class="stat">Estimates <b>${res.sumEst}</b> · ${ou}${res.riskLevel > 0 && res.sumEst !== 13 ? ` · <b>${riskName(res.riskLevel)}</b>` : ""}</span>`;
  } else {
    const left = draft.est.filter((e, i) => e === null && !draft.dashCall[i]).length;
    st += `<span class="stat">Estimates <b>${res.sumEst}</b> so far · ${left} to enter</span>`;
  }
  st += `<span class="stat">Tricks <b>${res.sumTricks}</b> of 13${res.tricksDone ? "" : ` · ${Math.max(0, 13 - res.sumTricks)} left`}</span>`;
  $("#status").innerHTML = st;

  const msgs = [];
  const zeros = res.est.filter(e => e === 0).length;
  if (res.estDone && res.sumEst === 13) msgs.push(["error", "Estimates add up to 13. The last player has to go over or under."]);
  if (res.estDone && res.caller === null) msgs.push(["error", speed ? "Pick the highest estimate as the Call." : "Pick who won the bidding as the Call."]);
  if (res.tricksDone && res.sumTricks !== 13) msgs.push(["error", `Tricks add up to ${res.sumTricks}. They have to add up to 13.`]);
  if (zeros > 2) msgs.push(["warn", "More than two players are on zero. Most tables allow two at most."]);
  if (!speed && res.caller !== null && res.est[res.caller] !== null && res.est[res.caller] < R.minBid)
    msgs.push(["warn", `The call is ${res.est[res.caller]}. The minimum call is ${R.minBid}.`]);
  if (!speed && res.caller !== null){
    const ce = res.est[res.caller];
    [0, 1, 2, 3].forEach(i => { if (i !== res.caller && res.est[i] !== null && ce !== null && res.est[i] > ce) msgs.push(["warn", `${nameOf(g, i)} estimated more than the call.`]); });
  }
  if (res.estDone && res.riskLevel > 0 && res.sumEst !== 13 && draft.risk === null)
    msgs.push(["warn", `This round has a ${riskName(res.riskLevel)}. Pick who estimated last to score it.`]);
  $("#msgs").innerHTML = msgs.map(([t, m]) => `<li class="${t}">${esc(m)}</li>`).join("");

  const errors = msgs.some(m => m[0] === "error");
  const ready = res.complete && res.sumEst !== 13 && res.caller !== null && !errors;
  const save = $("#saveBtn");
  save.disabled = !ready;
  const verb = editingIndex !== null ? "Update" : "Save";
  save.textContent = ready ? `${verb} round ${no}` : (!res.estDone ? "Enter all estimates" : (!res.tricksDone ? "Enter tricks won" : `${verb} round ${no}`));
  $("#cancelBtn").hidden = editingIndex === null;
  $("#deleteBtn").hidden = editingIndex === null;
  $("#clearBtn").hidden = editingIndex !== null;
  updateAppbar();
}

/* ---------- Scores ---------- */
function roundsTable(g, c, editable){
  const n = g.rounds.length;
  if (!n) return `<p class="empty">No rounds yet. Saved rounds appear here.</p>`;
  const teams = g.mode === "teams";
  const order = teams ? [0, 2, 1, 3] : [0, 1, 2, 3];
  let h = `<div class="table-wrap"><table><thead><tr><th scope="col">Round</th>` +
    order.map(i => `<th scope="col"><span class="dot c${colorOf(g, i)}" aria-hidden="true"></span>${esc(nameOf(g, i))}</th>`).join("") +
    (teams ? [0, 1].map(t => `<th scope="col" class="tcol"><span class="dot c${t}" aria-hidden="true"></span>${esc(teamNameOf(g, t))}</th>`).join("") : "") +
    `</tr></thead><tbody>`;
  g.rounds.forEach((r, idx) => {
    const res = c.rounds[idx], no = idx + 1;
    let sub = (r.suit ? suitGlyph(r.suit) + " · " : "") + (res.speed ? "Speed" : "Bid");
    if (res.estDone) sub += ` · ${res.over ? "over" : "under"} ${res.diff}`;
    const mx = (res.mult > 1 ? ` · ×${res.mult}` : "") + (res.bigFactor > 1 ? " · 8+ ×2" : "") + (res.dblFactor > 1 ? " · doubled" : "");
    h += `<tr data-idx="${idx}" class="${editable ? "click" : ""} ${editable && editingIndex === idx ? "editing" : ""}"><th scope="row">` +
      (editable ? `<button type="button" class="rbtn" data-idx="${idx}" aria-label="Fix round ${no}">${no}</button>` : `<span class="rno">${no}</span>`) +
      `<span class="rsub">${sub}${mx}</span>${res.saaydeh ? `<span class="rsub sa">Sa'aydeh</span>` : ""}</th>`;
    order.forEach(i => {
      const v = res.points ? res.points[i] : 0, ro = res.roles[i];
      let tag = ro.dashCall ? "DC" : ro.isCall ? "Call" : ro.isWith ? "With" : ro.isRisk ? "Risk" : "";
      if (res.parts && res.parts[i] && res.parts[i].some(x => x[0] === "Team bonus")) tag += (tag ? " · " : "") + "Team +" + g.rules.teamBonus;
      const est = ro.dashCall ? 0 : r.est[i];
      h += `<td><span class="v ${v < 0 ? "neg" : ""}">${res.saaydeh ? "0" : fmtPts(v)}</span><span class="sub">${est}/${r.tricks[i]}${res.made && res.made[i] ? " ✓" : ""}${tag ? " · " + tag : ""}</span></td>`;
    });
    if (teams) [0, 1].forEach(t => { const v = res.teamPoints[t]; h += `<td class="tcol"><span class="v ${v < 0 ? "neg" : ""}">${fmtPts(v)}</span></td>`; });
    h += `</tr>`;
  });
  h += `</tbody><tfoot><tr><th scope="row">Total</th>` + order.map(i => `<td>${fmtTotal(c.totals[i])}</td>`).join("") +
    (teams ? [0, 1].map(t => `<td class="tcol">${fmtTotal(c.teamTotals[t])}</td>`).join("") : "") + `</tr></tfoot></table></div>`;
  return h;
}
function scoresBody(g, c, editable){
  const n = g.rounds.length, R = g.rules;
  let html = "";
  if (n >= R.totalRounds) html += `<section class="banner final"><span class="win">${BADGE.king}<span><b>${esc(winnerText(g, c))}</b> after ${n} rounds.</span></span></section>`;
  html += `<section class="card"><div class="card-head"><h2>Standings</h2><span class="muted">${n} of ${R.totalRounds} rounds · ${presetLabel(R)}</span></div>${standList(g, c, "")}`;
  if (g.mode === "teams"){
    const pg = {mode: "single", players: g.players, teamNames: g.teamNames, rounds: g.rounds};
    html += `<p class="subhead">Players</p>` + standList(pg, c, "small compact", false).replace(/class="dot c(\d)"/g, (m, k) => `class="dot c${teamOf(+k)}"`);

  html += `<section class="card"><div class="card-head"><h2>Rounds</h2><span class="muted">${editable ? "Tap a round to fix it. " : ""}Under each score: estimate / tricks.</span></div>${roundsTable(g, c, editable)}</section>`;

function chartSeries(g, c){
  return g.mode === "teams"
    ? [0, 1].map(t => ({label: teamNameOf(g, t), values: c.teamCum[t], ci: t}))

}
function viewScores(){

    <section class="card"><h2>Share or finish</h2>
      <div class="actions" style="margin-top:10px"><button type="button" class="btn btn-ghost" id="copyBtn">Copy results</button><button type="button" class="btn btn-danger" id="endBtn">End game</button></div>

function afterScores(g, c){
  const series = chartSeries(g, c);
  $("#legend").innerHTML = series.map(s => `<span><i class="sw sw${s.ci}" aria-hidden="true"></i>${esc(s.label)}</span>`).join("");

function resultsText(g, c){
  const n = g.rounds.length;
  const s = sides(g, c), rk = ranks(s.map(x => x.total));
  const order = s.map((x, k) => k).sort((a, b) => s[b].total - s[a].total);
  let t = `Estimation · ${modeLabel(g)} · ${presetLabel(g.rules)}\n${n} of ${g.rules.totalRounds} rounds played\n\n`;
  order.forEach(k => { t += `${rk[k]}. ${s[k].label}${s[k].sub ? " (" + s[k].sub + ")" : ""}: ${fmtTotal(s[k].total)}\n`; });
  if (n) t += "\n";
  g.rounds.forEach((r, idx) => {
    const res = c.rounds[idx];
    t += `R${idx + 1}${r.suit ? " " + suitOf(r.suit).sym : ""}${res.mult > 1 ? ` (×${res.mult})` : ""}${r.doubled ? " (doubled)" : ""}: ` +
      (res.saaydeh ? "Sa'aydeh, nobody made it" : [0, 1, 2, 3].map(i => `${nameOf(g, i)} ${fmtPts(res.points[i])}`).join(", ")) + "\n";
  });
  return t;
}
function wireCopy(g, c){
  const btn = $("#copyBtn");
  btn.addEventListener("click", () => {
    const text = resultsText(g, c);
    const done = () => { btn.textContent = "Copied"; setTimeout(() => { btn.textContent = "Copy results"; }, 1800); };
    const fail = () => { $("#copyText").value = text; $("#copyFallback").hidden = false; $("#copyText").select(); };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fail);
      else fail();
    } catch (err) { fail(); }
  });
}
function viewPast(){
  const h = pastGame(), c = calcGame(h);
  V.innerHTML = scoresBody(h, c, false) + `
    <section class="card"><div class="actions"><button type="button" class="btn btn-ghost" id="copyBtn">Copy results</button><button type="button" class="btn btn-danger" id="delBtn">Delete this game</button></div>
      <div class="copy-fallback" id="copyFallback" hidden><p class="hint">Copying isn't allowed here. Select the text and copy it.</p><textarea id="copyText" readonly aria-label="Results text"></textarea></div></section>`;
  afterScores(h, c);
  wireCopy(h, c);
  $("#delBtn").addEventListener("click", e => armConfirm(e.currentTarget, "Tap again to delete", () => {
    store.history = store.history.filter(x => x.id !== h.id); persist(); go("home");
  }));
}

/* ---------- Chart ---------- */
function niceStep(raw){
  const pow = Math.pow(10, Math.floor(Math.log10(raw)));
  const f = raw / pow;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * pow;
}
function niceTicks(lo, hi){
  const step = niceStep((hi - lo || 10) / 4);
  const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step;
  const out = [];
  for (let v = a; v <= b + step / 2; v += step) out.push(Math.round(v));
  return out;
}
function drawChart(box, series, n){
  if (!n){ box.innerHTML = `<p class="empty">The chart starts after the first round.</p>`; return; }
  const W = Math.max(300, Math.round(box.clientWidth || 560)), H = 230;
  const m = {l: 40, r: 100, t: 14, b: 26};
  const all = series.flatMap(s => s.values);
  const ticks = niceTicks(Math.min(0, ...all), Math.max(0, ...all));
  const lo = ticks[0], hi = ticks[ticks.length - 1];
  const pw = W - m.l - m.r, ph = H - m.t - m.b;
  const x = i => m.l + i * pw / n;
  const y = v => m.t + (hi - v) * ph / ((hi - lo) || 1);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Running totals after every round. Exact numbers are in the Rounds table.">`;
  ticks.forEach(t => {
    s += `<line class="${t === 0 ? "zero" : "gl"}" x1="${m.l}" x2="${W - m.r}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"/>`;
    s += `<text class="tk" x="${m.l - 6}" y="${(y(t) + 4).toFixed(1)}" text-anchor="end">${fmtTotal(t)}</text>`;
  });
  const every = Math.max(1, Math.ceil(24 / (pw / n)));
  for (let i = 1; i <= n; i++) if (i % every === 0 || i === n) s += `<text class="tk" x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="middle">${i}</text>`;
  s += `<text class="tk" x="${m.l}" y="${H - 8}">Round</text>`;
  s += `<line class="ch" id="chx" y1="${m.t}" y2="${H - m.b}" x1="0" x2="0" style="display:none"/>`;
  series.forEach(se => {
    s += `<path class="ln s${se.ci}" d="${se.values.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + "," + y(v).toFixed(1)).join("")}"/>`;
  });
  series.forEach(se => { s += `<circle class="f${se.ci} ring" cx="${x(n).toFixed(1)}" cy="${y(se.values[n]).toFixed(1)}" r="4.5"/>`; });
  const ends = series.map((se, k) => ({k, y: y(se.values[n])})).sort((a, b) => a.y - b.y);
  if (ends.every((e, k) => k === 0 || e.y - ends[k - 1].y >= 15)){
    ends.forEach(e => {
      let nm = series[e.k].label; if (nm.length > 9) nm = nm.slice(0, 8) + "…";
      s += `<text class="el" x="${(x(n) + 10).toFixed(1)}" y="${(e.y + 4).toFixed(1)}">${esc(nm)} ${fmtTotal(series[e.k].values[n])}</text>`;
    });
  }
  series.forEach((se, k) => { s += `<circle class="f${se.ci} ring hv" data-k="${k}" r="4" cx="0" cy="0" style="display:none"/>`; });
  s += `<rect x="${m.l - 10}" y="0" width="${pw + 20}" height="${H}" fill="transparent"/></svg><div class="tip"></div>`;
  box.innerHTML = s;
  const svg = box.querySelector("svg"), tip = box.querySelector(".tip"), chx = box.querySelector("#chx");
  const hv = Array.from(box.querySelectorAll(".hv"));
  const show = ev => {
    const rect = svg.getBoundingClientRect(), scale = W / rect.width;
    const i = Math.max(0, Math.min(n, Math.round(((ev.clientX - rect.left) * scale - m.l) / (pw / n))));
    chx.setAttribute("x1", x(i)); chx.setAttribute("x2", x(i)); chx.style.display = "";
    hv.forEach(c => { const se = series[+c.dataset.k]; c.setAttribute("cx", x(i)); c.setAttribute("cy", y(se.values[i])); c.style.display = ""; });
    const order = series.map((se, k) => k).sort((a, b) => series[b].values[i] - series[a].values[i]);
    tip.innerHTML = `<div class="tt">${i === 0 ? "Start" : "After round " + i}</div>` + order.map(k =>
      `<div class="tr"><i class="sw sw${series[k].ci}" aria-hidden="true"></i><span>${esc(series[k].label)}</span><b>${fmtTotal(series[k].values[i])}</b></div>`).join("");
    tip.style.display = "block";
    const bx = x(i) / scale, tw = tip.offsetWidth;
    tip.style.left = (bx + 14 + tw > rect.width ? bx - tw - 14 : bx + 14) + "px";
  };
  const hide = () => { tip.style.display = "none"; chx.style.display = "none"; hv.forEach(c => { c.style.display = "none"; }); };
  svg.addEventListener("pointermove", show);
  svg.addEventListener("pointerdown", show);
  svg.addEventListener("pointerleave", hide);
}

/* ---------- Rules ---------- */
const FIELDS = [
  ["base", "Exact estimate (plus tricks won)"],
  ["callBonus", "Call: won or lost"],
  ["withBonus", "With: won or lost"],
  ["riskBonus", "Risk: won or lost per level"],
  ["onlyWinner", "Only winner bonus"],
  ["onlyLoser", "Only loser penalty"],
  ["teamBonus", "Teams: both partners make it (0 = off)"],
  ["dashOver", "Dash call, round over"],
  ["dashUnder", "Dash call, round under"],
  ["dashZeroUnder", "Dash without calling, round under (0 = none)"],
  ["bigCall", "Estimate that doubles the round (0 = off)"],
  ["riskStep", "Tricks away from 13 per risk level"],
  ["maxRisk", "Highest risk level"],
  ["minBid", "Minimum call"],
  ["totalRounds", "Rounds in a game"],
  ["speedRounds", "Speed rounds at the end"]
];
function fieldsHTML(prefix){
  return FIELDS.map(([k, label]) => `<label class="field" for="${prefix}-${k}"><span>${label}</span><input type="number" inputmode="numeric" min="0" step="1" id="${prefix}-${k}" data-k="${k}"></label>`).join("") +
    `<label class="field" for="${prefix}-saaydeh"><span>Sa'aydeh in a row</span><select id="${prefix}-saaydeh" data-k="saaydeh"><option value="double">×2, then ×4, ×8</option><option value="add">×2, then ×3, ×4</option></select></label>
     <label class="field check" for="${prefix}-riskExact"><input type="checkbox" id="${prefix}-riskExact" data-k="riskExact">Risk only at exact multiples away from 13 (with 2: totals of 15 or 11 are a Risk, 14 or 16 are not)</label>
     <label class="field check" for="${prefix}-withInSpeed"><input type="checkbox" id="${prefix}-withInSpeed" data-k="withInSpeed">With counts in speed rounds</label>`;
}
function fillFields(prefix, R){
  FIELDS.forEach(([k]) => { $(`#${prefix}-${k}`).value = R[k]; });
  $(`#${prefix}-saaydeh`).value = R.saaydeh;
  $(`#${prefix}-riskExact`).checked = !!R.riskExact;
  $(`#${prefix}-withInSpeed`).checked = !!R.withInSpeed;
}
function bindFields(box, R, onChange){
  box.addEventListener("input", e => {
    const t = e.target, k = t.dataset.k;
    if (!k || t.type === "checkbox" || t.tagName === "SELECT") return;
    const v = parseInt(t.value, 10);
    if (!Number.isFinite(v) || v < 0) return;
    R[k] = (k === "riskStep" || k === "totalRounds") ? Math.max(1, v) : v;
    if (R.speedRounds > R.totalRounds) R.speedRounds = R.totalRounds;
    onChange();
  });
  box.addEventListener("change", e => {
    const t = e.target, k = t.dataset.k;
    if (!k) return;
    if (t.type === "checkbox") R[k] = t.checked;
    else if (t.tagName === "SELECT") R[k] = t.value;
    else return;
    onChange();
  });
}
const listOr = a => a.length < 2 ? a.join("") : a.slice(0, -1).join(", ") + " or " + a[a.length - 1];
function riskTotals(R, level){
  const d = level * R.riskStep;
  return listOr([13 + d, 13 - d].filter(v => v >= 0 && v <= 52).map(String));
}
function riskText(R){
  if (!(R.riskStep > 0) || R.maxRisk < 1) return "There is no Risk bonus.";
  const levels = [];
  for (let k = 1; k <= Math.min(R.maxRisk, 3); k++) levels.push(`${riskTotals(R, k)} ${k === 1 ? "is a Risk" : "a " + riskName(k)}`);
  if (R.riskExact){
    const gaps = [];
    for (let d = 1; d < R.riskStep * 2; d++) if (d % R.riskStep !== 0) gaps.push(13 + d, 13 - d);
    gaps.sort((a, b) => b - a);
    return `Only exact totals count: ${levels.join(", ")}.` + (gaps.length ? ` Totals in between, like ${listOr(gaps.slice(0, 4).map(String))}, have no risk.` : "");
  }
  return `Each ${R.riskStep} tricks away from 13 adds a level: ${levels.join(", ")}. Totals in between count at the lower level.`;
}
function ruleItems(R){
  const items = [
    `Make your estimate exactly: <b>${R.base} + the tricks you won</b>. Miss it: lose the number of tricks you were off by.`,
    `<b>Call</b> (won the bidding) ±${R.callBonus} and <b>With</b> (same estimate as the call) ±${R.withBonus}: won if you make it, lost if you miss.`,
    `<b>Risk</b> (last to estimate) ±${R.riskBonus} per level. ${riskText(R)}`,
    `<b>Only winner</b> +${R.onlyWinner}. <b>Only loser</b> −${R.onlyLoser}.`,
    `<b>Dash call</b> (zero tricks, called before bidding): ±${R.dashOver} when the round is over, ±${R.dashUnder} when under.` +
      (R.dashZeroUnder > 0 ? ` A <b>Dash</b> (estimate of zero without calling) in an under round adds ±${R.dashZeroUnder}.` : ""),
    `<b>Sa'aydeh</b>: if nobody makes their estimate, the round scores nothing and the next round counts ×2` + (R.saaydeh === "double" ? `, then ×4 if it happens again.` : `, then ×3 if it happens again.`)
  ];
  if (R.bigCall > 0) items.push(`If anyone estimates <b>${R.bigCall} or more</b>, every score in that round is doubled.`);
  items.push(`<b>Double this round</b>: turn it on in a round and every score in that round counts twice, on top of any other doubling.`);
  if (R.speedRounds > 0){
    const first = R.totalRounds - R.speedRounds + 1;
    items.push(`Rounds ${first}–${R.totalRounds} are <b>speed rounds</b> with fixed trumps (${SUIT_ORDER.slice(0, Math.min(5, R.speedRounds)).join(", ")}). The highest estimate counts as the Call${R.withInSpeed ? "." : " and there is no With."}`);
  }
  items.push(R.teamBonus > 0
    ? `<b>Teams</b>: partners sit opposite and each scores on their own. When <b>both partners</b> make their estimates, the team gets <b>+${R.teamBonus}</b>, added to only one of them: the partner with the higher estimate (the lower seat number if they're equal).`
    : `<b>Teams</b>: partners sit opposite. Each player estimates and scores on their own, and the team's score is the two partners' points added together.`);
  return items.map(t => `<li>${t}</li>`).join("");
}
function rulesSummaryHTML(R){
  const rows = [
    ["Exact estimate", `${R.base} + tricks`],
    ["Call / With", `±${R.callBonus} / ±${R.withBonus}`],
    ["Risk", R.riskStep > 0 && R.maxRisk > 0
      ? `±${R.riskBonus} per level, ${R.riskExact ? "exact totals only" : "by range"}: ${riskTotals(R, 1)}${R.maxRisk >= 2 ? "; " + riskTotals(R, 2) : ""}${R.maxRisk >= 3 ? "…" : ""}`
      : "Off"],
    ["Only winner / loser", `+${R.onlyWinner} / −${R.onlyLoser}`],
    ["Dash call, over / under", `±${R.dashOver} / ±${R.dashUnder}`],
    ["Teams: both make it", R.teamBonus > 0 ? `+${R.teamBonus} to one partner` : "Nothing extra"],
    ["Rounds", `${R.totalRounds}${R.speedRounds ? `, last ${R.speedRounds} are speed rounds` : ""}`]
  ];
  if (R.dashZeroUnder > 0) rows.splice(5, 0, ["Dash, round under", `±${R.dashZeroUnder}`]);
  if (R.bigCall > 0) rows.push([`Estimate of ${R.bigCall}+`, "Round ×2"]);
  return `<dl class="kv">` + rows.map(([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`).join("") + `</dl>`;
}
function compareTable(){
  const sets = [["Online (Jawaker)", presetRules("jawaker")], ["Classic", presetRules("classic")], ["My rules", store.myRules]];
  const upTo = R => [1, 2, 3].slice(0, Math.max(0, Math.min(3, R.maxRisk)));
  const rows = [
    ["Exact estimate", R => `${R.base} + tricks`],
    ["Missed estimate", () => "− tricks off"],
    ["Call / With", R => `±${R.callBonus} / ±${R.withBonus}`],
    ["Only winner / loser", R => `+${R.onlyWinner} / −${R.onlyLoser}`],
    ["Dash call, over / under", R => `±${R.dashOver} / ±${R.dashUnder}`],
    ["Dash without calling, round under", R => R.dashZeroUnder > 0 ? `±${R.dashZeroUnder}` : "Nothing extra"],
    ["Risk levels", R => upTo(R).length ? upTo(R).map(k => riskName(k).replace(" risk", "")).join(", ") : "None"],
    ["Risk counts at", R => R.riskExact ? `Exactly ${listOr(upTo(R).map(k => String(k * R.riskStep)))} away` : `${R.riskStep} or more away`],
    ["Someone estimates 8+", R => R.bigCall > 0 ? `Round ×2 at ${R.bigCall}+` : "No change"],
    ["Teams: both partners make it", R => R.teamBonus > 0 ? `+${R.teamBonus} to one partner` : "Nothing extra"],
    ["Nobody makes it", R => R.saaydeh === "double" ? "Next round ×2, then ×4" : "Next round ×2, then ×3"]
  ];
  return `<div class="table-wrap compare"><table><thead><tr><th scope="col"></th>` + sets.map(s => `<th scope="col">${s[0]}</th>`).join("") + `</tr></thead><tbody>` +
    rows.map(([label, f]) => {
      const vals = sets.map(s => f(s[1]));
      const diff = vals.some(v => v !== vals[0]);
      return `<tr><th scope="row">${label}</th>` + vals.map(v => `<td class="${diff ? "diff" : ""}">${v}</td>`).join("") + `</tr>`;
    }).join("") + `</tbody></table></div>`;
}
const SOURCES = `<p class="sources">Online rules follow <a href="https://blog.jawaker.com/en/estimation-rules-en/">Jawaker's published rules</a>. Classic follows the common score-sheet tables (<a href="https://catsatcards.com/Games/Estimation.html">Cats at Cards</a>, <a href="https://bargames101.com/?p=16352">Bar Games 101</a>). My rules are the values saved on this phone.</p>`;
function viewRules(){
  const g = store.current;
  let html = "";
  if (g){
    html += `<section class="card"><h2>This game's rules</h2>
      <div class="seg" role="radiogroup" aria-label="Rule set" id="presetSeg">
        <button type="button" role="radio" data-preset="mine">Mine<small>Saved</small></button>
        <button type="button" role="radio" data-preset="jawaker">Online<small>Jawaker</small></button>
        <button type="button" role="radio" data-preset="classic">Classic<small>Score sheet</small></button>
        <button type="button" role="radio" data-preset="custom" disabled>Custom<small>Edited</small></button>
      </div>
      <ul class="rule-list" id="ruleList"></ul></section>
      <section class="card"><h2>Point values</h2><p class="hint">Changes apply to this game, and every round is scored again.</p>
        <div class="fields" id="fields">${fieldsHTML("set")}</div>
        <div class="actions" style="margin-top:14px"><button type="button" class="btn btn-ghost" id="saveMineBtn">Save as my rules for new games</button></div></section>`;
  }
  html += `<section class="card"><h2>Where the rules differ</h2>
    <p class="hint">Highlighted rows are where the rule sets disagree.</p>
    <div id="compareBox">${compareTable()}</div>${SOURCES}</section>`;
  V.innerHTML = html;
  if (!g) return;
  const paint = () => {
    const set = ruleSetOf(g.rules);
    $$("#presetSeg button").forEach(b => b.setAttribute("aria-checked", String(b.dataset.preset === set)));
    $("#ruleList").innerHTML = ruleItems(g.rules);
    const sb = $("#saveMineBtn"), same = sameRules(g.rules, store.myRules);
    sb.disabled = same;
    sb.textContent = same ? "These are your saved rules" : "Save as my rules for new games";
    $("#compareBox").innerHTML = compareTable();
  };
  fillFields("set", g.rules);
  paint();
  const changed = () => { persist(); paint(); updateAppbar(); };
  $("#presetSeg").addEventListener("click", e => {
    const b = e.target.closest("button[data-preset]");
    if (!b || b.dataset.preset === "custom") return;
    const src = b.dataset.preset === "mine" ? store.myRules : PRESETS[b.dataset.preset];
    SCORE_KEYS.forEach(k => { g.rules[k] = src[k]; });
    fillFields("set", g.rules);
    changed();
  });
  bindFields($("#fields"), g.rules, changed);
  $("#saveMineBtn").addEventListener("click", () => { store.myRules = pickRules(g.rules); store.last.rulesChoice = "mine"; changed(); });
}
function viewMyRules(){
  if (!rulesDraft) rulesDraft = pickRules(store.myRules);
  const R = rulesDraft;
  V.innerHTML = `
    <section class="card"><h2>My rules</h2>
      <p class="hint">Every new game starts with these rules. They're saved on this phone and load each time you open the app.</p>
      <p class="role-label" style="margin-top:12px">Fill in from</p>
      <div class="actions" id="loadFrom">
        <button type="button" class="btn btn-ghost" data-load="jawaker">Online (Jawaker)</button>
        <button type="button" class="btn btn-ghost" data-load="classic">Classic</button>
        <button type="button" class="btn btn-ghost" data-load="saved">My saved rules</button>
      </div></section>
    <section class="card"><h2>Point values</h2><div class="fields" id="myFields">${fieldsHTML("my")}</div></section>
    <section class="card"><h2>How these rules score</h2><ul class="rule-list" id="myList"></ul></section>
    <div class="sticky-cta"><div class="actions save-bar">
      <button type="button" class="btn btn-primary" id="saveRulesBtn">Save my rules</button>
      ${store.current ? `<button type="button" class="btn btn-ghost" id="applyBtn">Use in current game</button>` : ""}
    </div></div>`;
  const paint = () => {
    $("#myList").innerHTML = ruleItems(R);
    const dirty = !sameRules(R, store.myRules);
    const sb = $("#saveRulesBtn");
    sb.disabled = !dirty;
    sb.textContent = dirty ? "Save my rules" : "Saved ✓";
    const ab = $("#applyBtn");
    if (ab){
      const inUse = !dirty && sameRules(store.current.rules, store.myRules);
      ab.disabled = inUse;
      ab.textContent = inUse ? "In use in current game" : (dirty ? "Save and use in current game" : "Use in current game");
    }
  };
  fillFields("my", R);
  paint();
  bindFields($("#myFields"), R, paint);
  $("#loadFrom").addEventListener("click", e => {
    const b = e.target.closest("button[data-load]");
    if (!b) return;
    if (b.dataset.load === "saved") RULE_KEYS.forEach(k => { R[k] = store.myRules[k]; });
    else SCORE_KEYS.forEach(k => { R[k] = PRESETS[b.dataset.load][k]; });
    fillFields("my", R);
    paint();
  });
  const save = () => { store.myRules = pickRules(R); store.last.rulesChoice = "mine"; persist(); };
  $("#saveRulesBtn").addEventListener("click", () => { save(); paint(); });
  const ab = $("#applyBtn");
  if (ab) ab.addEventListener("click", () => { save(); store.current.rules = pickRules(R); persist(); paint(); });
}

/* ---------- Start ---------- */
let rt;
window.addEventListener("resize", () => {
  clearTimeout(rt);
  rt = setTimeout(() => {
    if (view === "scores") afterScores(store.current, calc);
    else if (view === "past"){ const h = pastGame(); if (h) afterScores(h, calcGame(h)); }
  }, 150);
});
route();
try {
  if ("serviceWorker" in navigator && location.protocol === "https:" && window.self === window.top && !/claude\.ai$|claudeusercontent\.com$|appassets\.androidplatform\.net$/.test(location.hostname)){
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
} catch (e) {}
})();
</script>
